[project]
name = "haq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.12.0",
    "google-genai>=3.6.1",
    "jinja2>=3.1.6",
    "nemoguardrails>=0.25.0",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "reportlab>=5.1.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
